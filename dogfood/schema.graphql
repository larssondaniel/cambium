"""
A person with an account.
"""
type User {
  id: ID!
  name: String!
  displayName: String
  contact: Contact @deprecated(reason: "Use `User.contact.email`")
}

type Contact {
  email: String
  phone: String
}

enum OrderStatus {
  PENDING
  PAID
  SHIPPED
  REFUNDED
}

type Order {
  id: ID!
  status: OrderStatus!
  customer: User!
}

type Invoice {
  id: ID!
  order: Order!
  note: String
}

type Query {
  user(id: ID!): User
  orders(status: OrderStatus): [Order!]!
  invoices(status: OrderStatus): [Invoice!]!
  search(term: String!, sort: String): [User!]!
}
